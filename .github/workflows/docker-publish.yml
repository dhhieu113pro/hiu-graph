name: Docker Publish

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: hiu-graph:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker auto-index startup flow
        run: |
          docker run --rm \
            --mount type=bind,src="$PWD",dst=/workspace,readonly \
            --workdir /workspace \
            hiu-graph:smoke \
            python -m unittest test_docker_entrypoint.py tests.test_docker_entrypoint_health -v

      - name: Verify Docker llama.cpp endpoint default
        run: |
          test "$(docker run --rm hiu-graph:smoke python -c 'import os; print(os.environ["LLAMA_CPP_BASE_URL"])')" \
            = "http://host.docker.internal:8080"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
